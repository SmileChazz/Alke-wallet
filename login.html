<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión - Alke Wallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="text-center py-4">
<h1>Alke Wallet</h1>
</header>
<!-- validación de credenciales -->
<main class="container" style="max-width: 480px;">
<section class="card">
    <div class="card-body">
    <h2 class="card-title mb-4">Iniciar sesión</h2>
    <form id="login-form">
        <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" id="email" name="email" class="form-control" required />
        </div>

        <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" name="password" minlength="6" class="form-control" required />
        </div>

        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>

    <p id="login-error" class="text-danger mt-3" style="display:none;">Credenciales incorrectas.</p>
    </div>
</section>
</main>

<footer>
<p>&copy; 2026 Alke Wallet</p>
</footer>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
