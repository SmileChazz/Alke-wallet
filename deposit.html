<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Depositar - Alke Wallet</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<!-- Gestión de saldo y depósitos -->
<header>
<h1>Alke Wallet</h1>
<nav>
    <ul>
    <li><a href="menu.html">Inicio</a></li>
    <li><a href="deposit.html">Depositar</a></li>
    <li><a href="sendmoney.html">Enviar dinero</a></li>
    <li><a href="transactions.html">Movimientos</a></li>
    <li><a href="index.html">Cerrar sesión</a></li>
    </ul>
</nav>
</header>

<main>
<section id="current-balance">
    <h2>Saldo actual</h2>
    <p id="balance-amount">$0.00</p>
</section>

<section id="deposit-section">
    <h2>Realizar depósito</h2>
    <form id="deposit-form">
    <div>
        <label for="deposit-amount">Monto a depositar</label>
        <input
        type="number"
        id="deposit-amount"
        name="deposit-amount"
        min="1"
        step="0.01"
        placeholder="0.00"
        required
        />
    </div>

    <button type="submit">Realizar depósito</button>
    </form>

    <p id="deposit-message" style="display:none;"></p>
</section>
</main>

<footer>
<p>&copy; 2026 Alke Wallet</p>
</footer>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
