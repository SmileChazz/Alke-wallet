<head>

<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<!--enviar dinero -->
<header>
<nav class="navbar navbar-expand-md navbar-dark">
    <div class="container">
    <a class="navbar-brand" href="menu.html">Alke Wallet</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Abrir navegación">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="menu.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="deposit.html">Depositar</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="sendmoney.html">Enviar dinero</a></li>
        <li class="nav-item"><a class="nav-link" href="transactions.html">Movimientos</a></li>
        <li class="nav-item">
            <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#logoutModal">Cerrar sesión</a>
        </li>
        </ul>
    </div>
    </div>
</nav>
</header>

<div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
<div class="modal-dialog">
    <div class="modal-content">
    <div class="modal-header">
        <h5 class="modal-title" id="logoutModalLabel">Cerrar sesión</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
    </div>
    <div class="modal-body">
        ¿Estás seguro de que quieres cerrar sesión?
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <a href="index.html" class="btn btn-primary">Sí, cerrar sesión</a>
    </div>
    </div>
</div>
</div>

<main class="container" style="max-width: 640px;">
<section id="send-money-section" class="card mb-4">
    <div class="card-body">
    <h2 class="card-title mb-4">Enviar dinero</h2>
    <form id="sendmoney-form">
        <div class="mb-3 position-relative">
        <label for="contact-search" class="form-label">Buscar contacto</label>
        <input
            type="text"
            id="contact-search"
            name="contact-search"
            class="form-control"
            placeholder="Escribí un nombre..."
            autocomplete="off"
            required
        />
        <ul id="contact-suggestions" class="list-group position-absolute w-100" style="z-index: 10; display:none;"></ul>
        </div>

        <div class="mb-3">
        <label for="send-amount" class="form-label">Monto a enviar</label>
        <input
            type="number"
            id="send-amount"
            name="send-amount"
            class="form-control"
            min="1"
            step="0.01"
            placeholder="0.00"
            required
        />
        </div>

        <button type="submit" class="btn btn-primary w-100">Enviar</button>
    </form>

    <p id="send-message" class="text-danger mt-3" style="display:none;"></p>
    </div>
</section>

<section id="contacts-section" class="card">
    <div class="card-body">
    <h2 class="card-title">Mis contactos</h2>

    <ul id="contacts-list">
    </ul>

    <button type="button" id="add-contact-btn" class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#addContactModal">Agregar nuevo contacto
    </button>
    </div>
</section>
</main>

<div class="modal fade" id="addContactModal" tabindex="-1" aria-labelledby="addContactModalLabel" aria-hidden="true">
<div class="modal-dialog">
    <div class="modal-content">
    <div class="modal-header">
        <h5 class="modal-title" id="addContactModalLabel">Agregar nuevo contacto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
    </div>
    <div class="modal-body">

        <form id="add-contact-form">
        <div class="mb-3">
            <label for="new-contact-name" class="form-label">Nombre</label>
            <input type="text" id="new-contact-name" name="new-contact-name" class="form-control" required />
        </div>
        <div class="mb-3">
            <label for="new-contact-alias" class="form-label">Alias o CBU</label>
            <input type="text" id="new-contact-alias" name="new-contact-alias" class="form-control" required />
        </div>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" form="add-contact-form" class="btn btn-primary">Guardar contacto</button>
    </div>
    </div>
</div>
</div>

<footer>
<p>&copy; 2026 Alke Wallet</p>
</footer>

<script src="js/app.js"></script>
</body>
</html>
